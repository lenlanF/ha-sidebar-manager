name: Source checks
on:
  push:
    branches: [main, dev/compat-foundation]
  pull_request:
concurrency:
  group: source-checks-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("custom_components").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          PY
      - name: Check JavaScript syntax
        run: |
          node --check custom_components/panel_iframe/www/panel_iframe.js
          node --check custom_components/panel_iframe/www/manager.js
          node tests/test_frontend_panel.cjs
      - name: Install DOM testing dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Exercise sidebar manager DOM behaviors
        run: node tests/test_manager_ui.cjs
      - name: Install targeted test dependencies
        run: pip install pytest voluptuous
      - name: Run config validation tests with HA stubs
        run: python -m pytest -q tests/test_validation_isolated.py tests/test_manager_isolated.py tests/test_backup_validation_isolated.py

  homeassistant-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install current Home Assistant Core
        run: python -m pip install "homeassistant>=2026.9,<2026.11"
      - name: Import integration and register command schema
        run: |
          python - <<'PY'
          from custom_components.panel_iframe.config_flow import SidebarConfigFlow, SidebarOptionsFlow
          from custom_components.panel_iframe.manager_api import ws_list, ws_save, ws_delete, ws_reorder, ws_backup, ws_restore
          from custom_components.panel_iframe import async_setup_entry, async_unload_entry
          for fn in (ws_list, ws_save, ws_delete, ws_reorder, ws_backup, ws_restore):
              assert fn._ws_command.startswith("panel_iframe/manager/")
          assert SidebarConfigFlow.VERSION == 1
          print("Home Assistant API imports and WebSocket command registration: OK")
          PY

  homeassistant-functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Home Assistant Core testing fixtures
        run: python -m pip install "pytest-homeassistant-custom-component" "homeassistant>=2026.10,<2026.11" "home-assistant-frontend==20260930.2"
      - name: Run actual Home Assistant configuration and lifecycle tests
        env:
          PYTEST_ADDOPTS: "--asyncio-mode=auto"
        run: python -m pytest -q tests/integration -x --disable-warnings

  chromium-manager-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile frontend interactions
        run: npx playwright test tests/browser/manager.spec.js --reporter=line

  cross-process-config-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Home Assistant test runtime
        run: python -m pip install "pytest-homeassistant-custom-component" "homeassistant>=2026.10,<2026.11" "home-assistant-frontend==20260930.2"
      - name: Process A - persist actual native HA ConfigEntry store
        env:
          HA_RESTART_PHASE: write
          HA_RESTART_FILE: ${{ runner.temp }}/ha-restart-core-config-entries.json
          PYTEST_ADDOPTS: "--asyncio-mode=auto"
        run: python -m pytest -q tests/integration/test_restart_persistence.py --disable-warnings
      - name: Process B - cold load saved storage into fresh HA Core manager
        env:
          HA_RESTART_PHASE: read
          HA_RESTART_FILE: ${{ runner.temp }}/ha-restart-core-config-entries.json
          PYTEST_ADDOPTS: "--asyncio-mode=auto"
        run: python -m pytest -q tests/integration/test_restart_persistence.py --disable-warnings

  pinned-upstream-source-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Home Assistant functional test runtime
        run: python -m pip install "pytest-homeassistant-custom-component" "homeassistant>=2026.10,<2026.11" "home-assistant-frontend==20260930.2"
      - name: Checkout genuine upstream integration at pinned commit
        run: |
          git init "${{ runner.temp }}/panel-iframe-original"
          git -C "${{ runner.temp }}/panel-iframe-original" remote add origin https://github.com/shaonianzhentan/panel_iframe.git
          git -C "${{ runner.temp }}/panel-iframe-original" fetch --depth=1 origin 90c849d34b3ebb749c5f62a3e206e62888e4c050
          git -C "${{ runner.temp }}/panel-iframe-original" checkout --detach FETCH_HEAD
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = Path(os.environ["RUNNER_TEMP"]) / "panel-iframe-original" / "custom_components" / "panel_iframe"
          assert json.loads((d / "manifest.json").read_text())["version"] == "2026.4.13"
          print("Pinned upstream source verified")
          PY
      - name: Process A - original upstream ConfigFlow and native storage
        env:
          HA_UPGRADE_PHASE: original
          HA_TEST_PLUGIN_SOURCE: ${{ runner.temp }}/panel-iframe-original/custom_components/panel_iframe
          HA_UPGRADE_FILE: ${{ runner.temp }}/original-panel-iframe-store.json
          PYTEST_ADDOPTS: "--asyncio-mode=auto"
        run: python -m pytest -q tests/integration/test_upstream_source_swap.py --disable-warnings -x
      - name: Process B - fork source loads the saved original entry
        env:
          HA_UPGRADE_PHASE: fork
          HA_UPGRADE_FILE: ${{ runner.temp }}/original-panel-iframe-store.json
          PYTEST_ADDOPTS: "--asyncio-mode=auto"
        run: python -m pytest -q tests/integration/test_upstream_source_swap.py --disable-warnings -x
